name: mingw

# Cross-compiles aria2c.exe for 64-bit Windows with mingw-w64 on Ubuntu.
# Dependency versions and configure flags follow Dockerfile.mingw / mingw-config,
# but the checked-out source (not upstream master) is what gets built.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      HOST: x86_64-w64-mingw32
      PREFIX: ${{ github.workspace }}/deps/x86_64-w64-mingw32

    steps:
    - uses: actions/checkout@v7

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          make binutils autoconf automake autotools-dev libtool \
          patch ca-certificates pkg-config git curl dpkg-dev \
          gcc-mingw-w64 g++-mingw-w64 autopoint libcppunit-dev \
          libxml2-dev libgcrypt20-dev lzip python3-docutils

    - name: Cache dependencies
      id: cache-deps
      uses: actions/cache@v6
      with:
        path: deps/x86_64-w64-mingw32
        key: mingw-deps-x86_64-${{ hashFiles('.github/workflows/mingw.yml') }}

    - name: Build dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: |
        set -eux
        mkdir -p "$PREFIX" "$RUNNER_TEMP/src"
        cd "$RUNNER_TEMP/src"
        BUILD=$(dpkg-architecture -qDEB_BUILD_GNU_TYPE)

        curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -O https://ftpmirror.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
        curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -O https://github.com/libexpat/libexpat/releases/download/R_2_5_0/expat-2.5.0.tar.bz2
        curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -O https://www.sqlite.org/2023/sqlite-autoconf-3430100.tar.gz
        curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -O https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
        curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -O https://github.com/c-ares/c-ares/releases/download/cares-1_19_1/c-ares-1.19.1.tar.gz
        curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -O https://libssh2.org/download/libssh2-1.11.0.tar.bz2

        tar xf gmp-6.3.0.tar.xz
        (cd gmp-6.3.0 && ./configure --disable-shared --enable-static \
          --prefix="$PREFIX" --host="$HOST" --disable-cxx --enable-fat \
          CFLAGS="-mtune=generic -O2 -g0" && make -j"$(nproc)" install)

        tar xf expat-2.5.0.tar.bz2
        (cd expat-2.5.0 && ./configure --disable-shared --enable-static \
          --prefix="$PREFIX" --host="$HOST" --build="$BUILD" \
          && make -j"$(nproc)" install)

        tar xf sqlite-autoconf-3430100.tar.gz
        (cd sqlite-autoconf-3430100 && ./configure --disable-shared --enable-static \
          --prefix="$PREFIX" --host="$HOST" --build="$BUILD" \
          && make -j"$(nproc)" install)

        tar xf zlib-1.3.1.tar.gz
        (cd zlib-1.3.1 && CC=$HOST-gcc AR=$HOST-ar LD=$HOST-ld \
          RANLIB=$HOST-ranlib STRIP=$HOST-strip \
          ./configure --prefix="$PREFIX" --libdir="$PREFIX/lib" \
          --includedir="$PREFIX/include" --static \
          && make -j"$(nproc)" install)

        tar xf c-ares-1.19.1.tar.gz
        (cd c-ares-1.19.1 && ./configure --disable-shared --enable-static \
          --without-random --prefix="$PREFIX" --host="$HOST" --build="$BUILD" \
          LIBS="-lws2_32" && make -j"$(nproc)" install)

        tar xf libssh2-1.11.0.tar.bz2
        (cd libssh2-1.11.0 && ./configure --disable-shared --enable-static \
          --prefix="$PREFIX" --host="$HOST" --build="$BUILD" \
          LIBS="-lws2_32" && make -j"$(nproc)" install)

    - name: Build aria2
      run: |
        set -eux
        autoreconf -i
        ./mingw-config
        make -j"$(nproc)"
        "$HOST-strip" src/aria2c.exe

    - name: Upload aria2c.exe
      uses: actions/upload-artifact@v4
      with:
        name: aria2c-win64
        path: src/aria2c.exe
        if-no-files-found: error
